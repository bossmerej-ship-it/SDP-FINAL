<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#155b39"><title>My Orders | Restaurant</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/styles.css"><script src="/assets/app.js" type="module"></script></head>
<body data-page="orders">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar"><div class="nav-wrap"><a class="brand" href="/">Restaurant<span class="brand-dot" aria-hidden="true">.</span></a><nav aria-label="Main navigation"><a href="/">Menu</a><a href="/orders" aria-current="page">My Orders</a><a href="/kitchen">Kitchen <span aria-hidden="true">↗</span></a></nav></div></header>
  <main id="main" class="orders-page">
    <div class="page-heading heading-with-action"><div><p class="eyebrow">ORDER TRACKING</p><h1>My Orders</h1><p class="subtitle">Check the status of your orders.</p></div><a class="button secondary" href="/">+ New order</a></div>
    <div id="page-error" class="notice error" role="alert" hidden></div>
    <p id="loading" class="loading" role="status">Loading orders…</p>
    <div id="orders-list" class="orders-grid" aria-live="polite" aria-relevant="additions text"></div>
    <button id="refresh-button" class="button secondary refresh-button" type="button">Refresh orders <span aria-hidden="true">↻</span></button>
  </main>
  <template id="order-template"><article class="order-card"><div class="order-top"><div><p class="eyebrow order-number"></p><h2 class="order-customer"></h2></div><span class="status-badge"></span></div><ol class="order-progress" aria-label="Order progress"><li>Accepted</li><li>Preparing</li><li>Ready</li></ol><p class="order-service"></p><ul class="order-meals"></ul><p class="order-comment" hidden></p><div class="order-price"><span>Total</span><strong></strong></div><p class="order-discount" hidden></p></article></template>
  <noscript><div class="noscript notice">Enable JavaScript to load your orders.</div></noscript>
</body>
</html>
